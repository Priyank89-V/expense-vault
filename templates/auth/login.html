{% extends 'base.html' %}
{% load static %}

{% block title %}Sign In - ExpenseVault{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <div class="brand-title" style="font-size: 1.5rem;">ExpenseVault</div>
            </div>
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to manage your finances, budgets, and track expenses.</p>
        </div>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label" for="id_username">Username</label>
                <div style="position: relative;">
                    <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter your username" required autofocus style="padding-left: 40px;">
                    <i class="fa-solid fa-user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="id_password">Password</label>
                <div style="position: relative;">
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required style="padding-left: 40px;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px; font-size: 0.95rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Account
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 18px; font-size: 0.88rem; color: var(--text-muted);">
            Don't have an account yet? 
            <a href="{% url 'register' %}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create One Here</a>
        </div>
    </div>
</div>
{% endblock %}
